<rect x="80" y="689" width="1280" height="77" rx="12" fill="#eaf4f6"/>
<text x="107" y="722" font-family="Arial" font-size="19" font-weight="700" fill="#21717c">Princípio essencial</text>
<text x="107" y="749" font-family="Arial" font-size="18" fill="#436b7d">O cliente não informa quem venceu; apenas envia entradas. O servidor calcula a verdade da partida.</text>
