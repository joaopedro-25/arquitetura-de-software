<text x="95" y="914" font-family="Arial" font-size="16" font-weight="700" fill="#9b641b">PONTO ÚNICO DE FALHA (SPOF)</text>
<text x="95" y="936" font-family="Arial" font-size="14" fill="#735d40">Banco Primário → réplica + detecção de falha, promoção e redirecionamento (failover). Réplica isolada não garante disponibilidade.</text>
<text x="74" y="1005" font-family="Arial" font-size="13.2" fill="#657a90">Seta = direção de comunicação ou dependência. Linha tracejada = evento, notificação ou replicação. Modelo didático, não arquitetura oficial do iFood.</text>
