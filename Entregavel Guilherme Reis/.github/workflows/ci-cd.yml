name: CI/CD · DevPath

on:
  push:
    branches: [main]
    paths:
      - "Entregavel Guilherme Reis/**"
  pull_request:
    branches: [main]
    paths:
      - "Entregavel Guilherme Reis/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Entregavel Guilherme Reis
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Executar testes
        run: npm test
      - name: Gerar build de produção
        run: npm run build
      - name: Construir imagem Docker
        run: docker build -t devpath-guilherme-reis:ci .
      - name: Salvar build para deploy
        uses: actions/upload-artifact@v4
        with:
          name: devpath-site
          path: Entregavel Guilherme Reis/dist

  deploy:
    name: Deploy · GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Baixar build aprovado
        uses: actions/download-artifact@v4
        with:
          name: devpath-site
          path: site
      - name: Publicar aplicação
        id: deployment
        uses: actions/deploy-pages@v4
